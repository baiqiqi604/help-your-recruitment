name: CI

on:
  push:
    branches: [master, langgraph, langchain]
  pull_request:

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 双版本共享文件同步一致性检查
        # langchain_version 与 langgraph_version 的共享文件必须逐字节一致
        # （约定：改动先在 langgraph 落地，随后同步到 langchain）
        run: python scripts/check_sync.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 ruff
        run: pip install ruff==0.16.3

      - name: 运行 ruff 静态检查（规则集见根目录 ruff.toml）
        run: ruff check langgraph_version langchain_version scripts start_web.py resume_optimizer

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
        include:
          - version: langgraph_version
            cov_modules: >-
              --cov=config --cov=llm_client --cov=graph --cov=agent
              --cov=jd_analyzer --cov=content_optimizer --cov=company_researcher
              --cov=interview_advisor --cov=resume_reader --cov=resume_writer
              --cov=interview_knowledge_base --cov=jd_knowledge_base
              --cov=web_app --cov=validate_runtime --cov=main --cov=experience_processor
          - version: langchain_version
            cov_modules: >-
              --cov=config --cov=llm_client --cov=chain --cov=agent
              --cov=jd_analyzer --cov=content_optimizer --cov=company_researcher
              --cov=interview_advisor --cov=resume_reader --cov=resume_writer
              --cov=interview_knowledge_base --cov=jd_knowledge_base
              --cov=web_app --cov=validate_runtime --cov=main --cov=experience_processor
              --cov=jd_crawler --cov=scheduler
    defaults:
      run:
        working-directory: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装运行依赖
        run: pip install -r requirements.txt

      - name: 安装测试依赖
        run: pip install -r requirements-dev.txt

      - name: 运行测试（MOCK_LLM 模式，无需 API Key）
        env:
          MOCK_LLM: "1"
        # 注意：--cov 必须指向被测源码而非 tests 包自身，否则覆盖率恒为 ~100% 无意义
        run: >-
          pytest
          ${{ matrix.cov_modules }}
          --cov-report=term-missing --cov-fail-under=60
