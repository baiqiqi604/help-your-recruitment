name: CI

on:
  push:
    branches: [master, langgraph, langchain]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    defaults:
      run:
        working-directory: langgraph_version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装运行依赖
        run: pip install -r requirements.txt

      - name: 安装测试依赖
        run: pip install -r requirements-dev.txt

      - name: 运行测试（MOCK_LLM 模式，无需 API Key）
        env:
          MOCK_LLM: "1"
        # 注意：--cov 必须指向被测源码而非 tests 包自身，否则覆盖率恒为 ~100% 无意义
        run: >-
          pytest
          --cov=config --cov=llm_client --cov=graph --cov=agent
          --cov=jd_analyzer --cov=content_optimizer --cov=company_researcher
          --cov=interview_advisor --cov=resume_reader --cov=resume_writer
          --cov=interview_knowledge_base --cov=jd_knowledge_base
          --cov=web_app --cov=validate_runtime --cov=main --cov=experience_processor
          --cov-report=term-missing --cov-fail-under=60
